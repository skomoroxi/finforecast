<div class="fcard">
  <div class="fcard__left">
    <div class="fcard__label">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2 14l5-5 3 3 7-7M12 5h5v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      {{ card.label }}
    </div>
    {% if card.meta %}<div class="meta">{{ card.meta }}</div>{% endif %}
  </div>
  <div class="fcard__right">
    <div class="big-number">{{ card.value }}</div>
    <div class="meta">{{ card.unit }}{% if card.change != "—" %}<span class="fcard__chg {{ card.dir }}"> · {{ card.change }}</span>{% endif %}</div>
  </div>
</div>
