{% load i18n %}
<header class="nav">
  <div class="nav__inner container">
    <a class="wordmark" href="/" aria-label="{% translate 'FinForecast home' %}">FinForecast</a>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
      <span class="visually-hidden">{% translate "Menu" %}</span>
      <span class="bars" aria-hidden="true"></span>
    </button>
    <nav id="nav-menu" class="nav__menu" aria-label="{% translate 'Main' %}">
      <ul class="nav__links">
        {% for g in nav_groups %}
          <li class="dropdown">
            <button class="dropdown__btn" type="button" aria-expanded="false">
              {{ g.title }}
              <svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
            <ul class="dropdown__menu">
              {% for c in g.cards %}<li><a href="{{ c.url }}">{{ c.name }}</a></li>{% endfor %}
              <li><a href="{{ g.url }}"><strong>{% translate "View all" %}</strong></a></li>
            </ul>
          </li>
        {% endfor %}
        <li><a href="{% url 'accuracy' %}">{% translate "Accuracy" %}</a></li>
        <li><a href="{% url 'methodology' %}">{% translate "Methodology" %}</a></li>
      </ul>
    </nav>
  </div>
</header>
