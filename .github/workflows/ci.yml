# Lint + tests against real PostgreSQL/TimescaleDB and Redis, then build the image.
# On main, a green run triggers the deploy (deploy.yml, workflow_run).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_DB: finforecast
          POSTGRES_USER: finforecast
          POSTGRES_PASSWORD: finforecast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finforecast" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.9-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://finforecast:finforecast@localhost:5432/finforecast
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t finforecast:${{ github.sha }} .
      - name: Smoke-run the image
        run: docker run --rm -e DJANGO_SECRET_KEY=x finforecast:${{ github.sha }} python manage.py check
